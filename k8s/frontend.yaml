apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: poc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: akspocacrav74ka.azurecr.io/frontend:v1
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://backend:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: poc-app
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080