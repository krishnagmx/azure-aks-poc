apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: poc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: akspocacrc8titw.azurecr.io/backend:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: poc-app
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
